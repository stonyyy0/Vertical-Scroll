org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=false
org.gradle.dependency.verification.snapshot.cache.hours=0

# Default build target. Override on the command line: -Pmc_target=26.1
mc_target=1.21.x

# Gradle runs on JDK 25 (Loom enforces Java 25 for MC 26.x). The 1.21.x profiles compile
# against a Java 21 toolchain, so both JDKs are registered below for toolchain resolution
# (mise's install dir isn't on Gradle's auto-detect list). Update these paths per machine.
org.gradle.java.home=/home/stony/.local/share/mise/installs/java/25
org.gradle.java.installations.paths=/home/stony/.local/share/mise/installs/java/21,/home/stony/.local/share/mise/installs/java/25
# Only use the mise JDKs above — don't auto-detect IntelliJ's ~/.jdks (a Loom EA 25 + JDK 26
# live there). Same-version JDKs select nondeterministically, and NeoForm's recompile (keyed
# on the JDK) fails on the EA build. auto-detect=false makes toolchain selection deterministic.
org.gradle.java.installations.auto-detect=false

# 1.15-SNAPSHOT supports both 1.21.x and 26.1 (1.15.5 predates 26.1 and lacks unobfuscated support)
loom_version=1.15-SNAPSHOT

mod_version=1.3.0
maven_group=io.redstonerdev
archives_base_name=verticalscroll
